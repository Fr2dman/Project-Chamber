# configs/env.yaml
seed: 42
num_envs: 4 # 1→4 권장(벡터화로 샘플 다양성)
env_module: simulator.environment
env_class: AdvancedSmartACSimulator
env_kwargs:
  num_zones: 4

# 벡터랩핑/정규화
wrappers:
  - VecMonitor
  - VecNormalize:
      norm_obs: true
      norm_reward: false # 보상 스케일링은 지금 충분히 안정적
      clip_obs: 10.0
      gamma: 0.995

# 에피소드 세팅
episode:
  max_steps: 720 # 720×15s ≈ 3시간 (CONTROL_TERM=15 기준)
  time_limit_done: true

# 초기조건(도메인 랜덤)
reset:
  temp_C:
    mode: uniform
    low: 23.0
    high: 30.0
  rh_pct:
    mode: uniform
    low: 50.0
    high: 80.0
  tsv_sim_enable: true # 학습에만 가짜 TSV 사용 (실전 배포 시 false)

# 로깅/진단
logging:
  reward_breakdown: true
  log_every_steps: 1000
  eval_every_steps: 10000
  eval_episodes: 5
  save_best: true

env:
  num_zones: 4
  reset_randomizer:
    temp_C:
      buckets: [[23.0, 26.0], [26.0, 30.0]]
      probs: [0.5, 0.5]
    rh_pct:
      range: [50.0, 80.0]

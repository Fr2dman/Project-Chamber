# configs/reward.yaml
# hvac_config.py가 자동 로드(동일 폴더 배치 또는 환경변수 REWARD_YAML 지정)
LEVEL_MODE: threshold

RW:
  # ── 핵심 밀도 신호 ──
  prog: 0.8
  level: 0.35
  fair: 0.20
  track: 0.30
  # ── 환경 제약 ──
  hum: 0.20
  co2: 0.15
  # ── 조작 비용 ──
  act_delta: 0.05
  act_use: 0.00
  # ── TSV 보조 ──
  dir: 0.03
  cool_align: 0.05
  # ── 누적 에너지(터미널) ──
  energy: 0.15

# 참고: 누적 에너지(터미널) 모드는 hvac_config.py의 ENERGY_MODE="cumulative"로 이미 활성화됨.
#       이 모드에서는 ENERGY_GATE는 사용되지 않지만, 스키마 호환을 위해 남겨둠.
USE_ENERGY_GATE: false
ENERGY_GATE:
  MIN_ALL: 80.0
  GOOD_THRESH: 80.0
  PCT_GOOD: 0.80
